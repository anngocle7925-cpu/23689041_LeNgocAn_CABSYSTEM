openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nền tảng đặt xe trực tuyến.


    API hỗ trợ các nghiệp vụ chính:

    - Quản lý tài khoản khách hàng và tài xế

    - Đặt xe và quản lý chuyến

    - Tìm và phân công tài xế

    - Theo dõi trạng thái và vị trí chuyến

    - Tính cước và thanh toán

    - Gửi thông báo

    - Đánh giá tài xế

    - Quản trị, vận hành và báo cáo


    Tài liệu này được xây dựng dựa trên SRS của CAB System. Các quy tắc nghiệp vụ

    chưa được xác định trong SRS, như công thức tính cước, tiêu chí ưu tiên tài xế,

    thời gian timeout và chính sách hủy chuyến, không được cố định trong API.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Matching
  description: Tìm và phân công tài xế
paths:
  /rides/{rideId}/matching:
    post:
      tags:
      - Matching
      summary: Tìm và phân công tài xế
      operationId: matchDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Kết quả tìm và phân công tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rides/{rideId}/accept:
    post:
      tags:
      - Matching
      summary: Tài xế chấp nhận chuyến
      operationId: acceptRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Chấp nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /rides/{rideId}/reject:
    post:
      tags:
      - Matching
      summary: Tài xế từ chối chuyến
      operationId: rejectRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRideRequest'
      responses:
        '200':
          description: Từ chối chuyến và tiếp tục quy trình tìm tài xế khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.762622
        longitude:
          type: number
          format: double
          example: 106.660172
        address:
          type: string
          example: Điểm đón
    MatchingResult:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        driverId:
          type: string
          nullable: true
          example: DRV001
        status:
          type: string
          enum:
          - DRIVER_ASSIGNED
          - SEARCHING_DRIVER
          - NO_DRIVER_AVAILABLE
        message:
          type: string
          example: Đã phân công tài xế
    RejectRideRequest:
      type: object
      properties:
        reason:
          type: string
          example: Không thể nhận chuyến
    Ride:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: CUS001
        driverId:
          type: string
          nullable: true
          example: DRV001
        pickupLocation:
          $ref: '#/components/schemas/Location'
        dropoffLocation:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: MOTORBIKE
        status:
          $ref: '#/components/schemas/RideStatus'
        fare:
          $ref: '#/components/schemas/Fare'
    RideStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - DRIVER_ARRIVED
      - PICKED_UP
      - IN_TRANSIT
      - COMPLETED
      - CANCELLED
  responses:
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      description: Mã chuyến
      schema:
        type: string
        example: RIDE001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
