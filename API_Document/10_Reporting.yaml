openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nền tảng đặt xe trực tuyến.


    API hỗ trợ các nghiệp vụ chính:

    - Quản lý tài khoản khách hàng và tài xế

    - Đặt xe và quản lý chuyến

    - Tìm và phân công tài xế

    - Theo dõi trạng thái và vị trí chuyến

    - Tính cước và thanh toán

    - Gửi thông báo

    - Đánh giá tài xế

    - Quản trị, vận hành và báo cáo


    Tài liệu này được xây dựng dựa trên SRS của CAB System. Các quy tắc nghiệp vụ

    chưa được xác định trong SRS, như công thức tính cước, tiêu chí ưu tiên tài xế,

    thời gian timeout và chính sách hủy chuyến, không được cố định trong API.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Reporting
  description: Báo cáo
paths:
  /admin/reports/trips:
    get:
      tags:
      - Reporting
      summary: Báo cáo số lượng chuyến
      operationId: getTripReport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Báo cáo số lượng chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/revenue:
    get:
      tags:
      - Reporting
      summary: Báo cáo doanh thu
      operationId: getRevenueReport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/completion-rate:
    get:
      tags:
      - Reporting
      summary: Báo cáo tỷ lệ hoàn thành chuyến
      operationId: getCompletionRateReport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Tỷ lệ hoàn thành chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/cancellation-rate:
    get:
      tags:
      - Reporting
      summary: Báo cáo tỷ lệ hủy chuyến
      operationId: getCancellationRateReport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Tỷ lệ hủy chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/driver-performance:
    get:
      tags:
      - Reporting
      summary: Báo cáo hiệu suất tài xế
      operationId: getDriverPerformanceReport
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Hiệu suất tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPerformanceReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    DriverPerformanceReport:
      type: object
      properties:
        reportType:
          type: string
          example: DRIVER_PERFORMANCE
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        drivers:
          type: array
          items:
            type: object
            properties:
              driverId:
                type: string
                example: DRV001
              completedTrips:
                type: integer
                example: 120
              rating:
                type: number
                format: double
                example: 4.8
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    RateReport:
      type: object
      properties:
        reportType:
          type: string
          example: COMPLETION_RATE
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        rate:
          type: number
          format: double
          example: 92.5
    RevenueReport:
      type: object
      properties:
        reportType:
          type: string
          example: REVENUE
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        totalRevenue:
          type: number
          format: double
          example: 125000000
        currency:
          type: string
          example: VND
    TripReport:
      type: object
      properties:
        reportType:
          type: string
          example: TRIPS
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        totalTrips:
          type: integer
          example: 1250
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    FromDate:
      name: fromDate
      in: query
      required: true
      description: Ngày bắt đầu
      schema:
        type: string
        format: date
        example: '2026-09-01'
    ToDate:
      name: toDate
      in: query
      required: true
      description: Ngày kết thúc
      schema:
        type: string
        format: date
        example: '2026-09-13'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
