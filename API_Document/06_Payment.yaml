openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nền tảng đặt xe trực tuyến.


    API hỗ trợ các nghiệp vụ chính:

    - Quản lý tài khoản khách hàng và tài xế

    - Đặt xe và quản lý chuyến

    - Tìm và phân công tài xế

    - Theo dõi trạng thái và vị trí chuyến

    - Tính cước và thanh toán

    - Gửi thông báo

    - Đánh giá tài xế

    - Quản trị, vận hành và báo cáo


    Tài liệu này được xây dựng dựa trên SRS của CAB System. Các quy tắc nghiệp vụ

    chưa được xác định trong SRS, như công thức tính cước, tiêu chí ưu tiên tài xế,

    thời gian timeout và chính sách hủy chuyến, không được cố định trong API.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Payment
  description: Tính cước và thanh toán
paths:
  /rides/{rideId}/fare:
    get:
      tags:
      - Payment
      summary: Lấy kết quả tính cước chuyến
      operationId: getRideFare
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Kết quả tính cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rides/{rideId}/payments:
    post:
      tags:
      - Payment
      summary: Thanh toán chuyến đi
      operationId: createPayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Tạo yêu cầu thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /rides/{rideId}/payment:
    get:
      tags:
      - Payment
      summary: Xem thông tin thanh toán của chuyến
      operationId: getRidePayment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thông tin thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/callback:
    post:
      tags:
      - Payment
      summary: Nhận kết quả thanh toán từ Payment Gateway
      operationId: paymentCallback
      description: Payment Gateway gửi kết quả giao dịch về CAB System qua callback/webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: Đã tiếp nhận kết quả thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Thao tác thành công
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          example: PAY001
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND
        paymentMethod:
          type: string
          enum:
          - CASH
          - ELECTRONIC
        status:
          type: string
          enum:
          - PENDING
          - PAID
          - FAILED
        transactionId:
          type: string
          nullable: true
          example: TXN001
    PaymentCallbackRequest:
      type: object
      required:
      - paymentId
      - status
      properties:
        paymentId:
          type: string
          example: PAY001
        transactionId:
          type: string
          example: TXN001
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
    PaymentRequest:
      type: object
      required:
      - paymentMethod
      properties:
        paymentMethod:
          type: string
          enum:
          - CASH
          - ELECTRONIC
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      description: Mã chuyến
      schema:
        type: string
        example: RIDE001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
