openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nền tảng đặt xe trực tuyến.


    API hỗ trợ các nghiệp vụ chính:

    - Quản lý tài khoản khách hàng và tài xế

    - Đặt xe và quản lý chuyến

    - Tìm và phân công tài xế

    - Theo dõi trạng thái và vị trí chuyến

    - Tính cước và thanh toán

    - Gửi thông báo

    - Đánh giá tài xế

    - Quản trị, vận hành và báo cáo


    Tài liệu này được xây dựng dựa trên SRS của CAB System. Các quy tắc nghiệp vụ

    chưa được xác định trong SRS, như công thức tính cước, tiêu chí ưu tiên tài xế,

    thời gian timeout và chính sách hủy chuyến, không được cố định trong API.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Rating
  description: Đánh giá tài xế
paths:
  /rides/{rideId}/rating:
    post:
      tags:
      - Rating
      summary: Đánh giá tài xế
      operationId: rateDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Rating:
      type: object
      properties:
        ratingId:
          type: string
          example: RATE001
        rideId:
          type: string
          example: RIDE001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế phục vụ tốt
    RatingRequest:
      type: object
      required:
      - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế phục vụ tốt
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      description: Mã chuyến
      schema:
        type: string
        example: RIDE001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
