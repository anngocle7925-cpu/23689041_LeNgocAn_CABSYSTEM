openapi: 3.0.0
info:
  title: Auth Service API
  description: |
    Đăng ký và đăng nhập cho Khách hàng và Tài xế trong CAB System.
    Map FR: FR-01, FR-02.
    (Hồ sơ khách hàng: xem customer-profile-service.yaml.
     Hồ sơ & phương tiện tài xế: xem driver-profile-service.yaml.)
  version: 1.0.0

servers:
  - url: https://api.cabsystem.local/api/v1
    description: Production (giả lập)
  - url: http://localhost:8081/api/v1
    description: Local dev - Auth Service

tags:
  - name: Auth

paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản khách hàng
      description: FR-01 - Cho phép khách hàng đăng ký tài khoản mới bằng số điện thoại/email.
      operationId: registerCustomer
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, full_name]
              properties:
                phone:
                  type: string
                  example: "0901234567"
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                full_name:
                  type: string
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Số điện thoại/email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Đăng nhập (dùng chung cho khách hàng và tài xế)
      description: FR-02 - Xác thực người dùng bằng số điện thoại và mật khẩu, trả về access token.
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sai số điện thoại hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user_id:
          type: string

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
