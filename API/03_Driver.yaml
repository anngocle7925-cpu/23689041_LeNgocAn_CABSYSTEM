openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nhóm nghiệp vụ quản lý tài khoản tài xế.


    Đối chiếu SRS: FR-02.1, FR-02.2, FR-02.3, FR-02.4, FR-02.5, FR-04.7.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Driver
  description: Quản lý tài khoản, phương tiện, trạng thái và vị trí tài xế
paths:
  /drivers/register:
    post:
      tags:
      - Driver
      summary: Đăng ký tài khoản tài xế
      operationId: registerDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, tài khoản chờ phê duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-fr-reference: FR-02.1
      description: Tài xế tự đăng ký tài khoản; tài khoản ở trạng thái chờ duyệt cho đến khi được Operator phê duyệt.
  /drivers/me:
    get:
      tags:
      - Driver
      summary: Xem thông tin tài khoản tài xế
      operationId: getDriverProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-fr-reference: FR-02.3
    put:
      tags:
      - Driver
      summary: Cập nhật thông tin tài xế
      operationId: updateDriverProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-02.3
  /drivers/me/vehicle:
    put:
      tags:
      - Driver
      summary: Cập nhật thông tin phương tiện
      operationId: updateDriverVehicle
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-02.4
  /drivers/me/status:
    put:
      tags:
      - Driver
      summary: Cập nhật trạng thái sẵn sàng của tài xế
      operationId: updateDriverStatus
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-02.5
  /drivers/me/location:
    put:
      tags:
      - Driver
      summary: Cập nhật vị trí tài xế
      operationId: updateDriverLocation
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Cập nhật vị trí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-04.7
components:
  schemas:
    Driver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: 0912345678
        email:
          type: string
          format: email
          example: driver@example.com
        licenseNumber:
          type: string
          example: 79A123456
        approvalStatus:
          type: string
          enum:
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
        availabilityStatus:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        location:
          $ref: '#/components/schemas/Location'
        avatarUrl:
          type: string
          format: uri
          description: Ảnh đại diện tài xế.
    DriverRegisterRequest:
      type: object
      required:
      - fullName
      - phone
      - password
      - licenseNumber
      properties:
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: 0912345678
        email:
          type: string
          format: email
          example: driver@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: '********'
        licenseNumber:
          type: string
          example: 79A123456
      description: Thông tin đăng ký tài xế. Việc phê duyệt được xử lý bởi chức năng quản trị.
    DriverStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
    DriverUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Tran Van B
        email:
          type: string
          format: email
          example: driver@example.com
        licenseNumber:
          type: string
          example: 79A123456
        avatarUrl:
          type: string
          format: uri
          description: Ảnh đại diện tài xế.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.762622
        longitude:
          type: number
          format: double
          example: 106.660172
        address:
          type: string
          example: Điểm đón
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Thao tác thành công
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          example: VEH001
        driverId:
          type: string
          example: DRV001
        vehicleType:
          type: string
          example: MOTORBIKE
        licensePlate:
          type: string
          example: 59A12345
        vehicleModel:
          type: string
          example: Honda Vision
    VehicleUpdateRequest:
      type: object
      required:
      - vehicleType
      - licensePlate
      properties:
        vehicleType:
          type: string
          example: MOTORBIKE
        licensePlate:
          type: string
          example: 59A12345
        vehicleModel:
          type: string
          example: Honda Vision
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
