openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nhóm nghiệp vụ tìm và phân công tài xế.


    Đối chiếu SRS: FR-04.1 → FR-04.7.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Matching
  description: Tìm và phân công tài xế
paths:
  /rides/{rideId}/matching:
    post:
      tags:
      - Matching
      summary: Tìm và phân công tài xế
      operationId: matchDriver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Kết quả tìm và phân công tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Hệ thống xác định tài xế phù hợp, ưu tiên theo các tiêu chí đã được doanh nghiệp xác định, gửi đề xuất
        và xử lý chuyển sang tài xế kế tiếp khi từ chối hoặc không phản hồi. Không cố định bán kính, tiêu chí ưu tiên hoặc
        timeout trong API vì SRS chưa chốt.
      x-fr-reference: FR-04.1, FR-04.2, FR-04.3, FR-04.4, FR-04.5, FR-04.6
  /rides/{rideId}/accept:
    post:
      tags:
      - Matching
      summary: Tài xế chấp nhận chuyến
      operationId: acceptRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Chấp nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-fr-reference: FR-04.3
  /rides/{rideId}/reject:
    post:
      tags:
      - Matching
      summary: Tài xế từ chối chuyến
      operationId: rejectRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRideRequest'
      responses:
        '200':
          description: Từ chối chuyến và tiếp tục quy trình tìm tài xế khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-fr-reference: FR-04.5
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.762622
        longitude:
          type: number
          format: double
          example: 106.660172
        address:
          type: string
          example: Điểm đón
    MatchingResult:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        driverId:
          type: string
          nullable: true
          example: DRV001
        status:
          type: string
          enum:
          - DRIVER_ASSIGNED
          - SEARCHING_DRIVER
          - NO_DRIVER_AVAILABLE
        message:
          type: string
          example: Đã phân công tài xế
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverSummary'
          nullable: true
    RejectRideRequest:
      type: object
      properties:
        reason:
          type: string
          example: Không thể nhận chuyến
    Ride:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: CUS001
        driverId:
          type: string
          nullable: true
          example: DRV001
        pickupLocation:
          $ref: '#/components/schemas/Location'
        dropoffLocation:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: MOTORBIKE
        status:
          $ref: '#/components/schemas/RideStatus'
        fare:
          $ref: '#/components/schemas/Fare'
    RideStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - DRIVER_ARRIVED
      - PICKED_UP
      - IN_TRANSIT
      - COMPLETED
      - CANCELLED
    DriverSummary:
      type: object
      properties:
        driverId:
          type: string
        fullName:
          type: string
        licensePlate:
          type: string
        avatarUrl:
          type: string
          format: uri
        phone:
          type: string
  responses:
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      description: Mã chuyến
      schema:
        type: string
        example: RIDE001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
