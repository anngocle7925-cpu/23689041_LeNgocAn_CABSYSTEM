openapi: 3.0.0
info:
  title: Trip Rating Service API
  description: |
    Đánh giá tài xế sau khi hoàn thành chuyến đi.
    Map FR: FR-13.
  version: 1.0.0

servers:
  - url: https://api.cabsystem.local/api/v1
    description: Production (giả lập)
  - url: http://localhost:8082/api/v1
    description: Local dev - dùng chung hạ tầng với Trip Service

tags:
  - name: TripRating

paths:
  /trips/{tripId}/rating:
    post:
      summary: Đánh giá tài xế sau chuyến đi
      description: |
        FR-13 - Khách hàng đánh giá tài xế. QT-17: chỉ khi Trip.status = completed.
        QT-18: mỗi chuyến chỉ được đánh giá 1 lần.
      operationId: rateTrip
      tags: [TripRating]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá trước đó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Rating:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        stars:
          type: integer
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
