openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nhóm nghiệp vụ quản lý tài khoản khách hàng.


    Đối chiếu SRS: FR-01.3.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Customer
  description: Quản lý tài khoản khách hàng
paths:
  /customers/me:
    get:
      tags:
      - Customer
      summary: Xem thông tin tài khoản khách hàng
      operationId: getCustomerProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-fr-reference: FR-01.3
      x-uc-reference: UC-08
    put:
      tags:
      - Customer
      summary: Cập nhật thông tin tài khoản khách hàng
      operationId: updateCustomerProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-01.3
      x-uc-reference: UC-08
components:
  schemas:
    Customer:
      type: object
      properties:
        customerId:
          type: string
          example: CUS001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: customer@example.com
        avatarUrl:
          type: string
          format: uri
          description: Ảnh đại diện của khách hàng.
    CustomerUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: customer@example.com
        avatarUrl:
          type: string
          format: uri
          description: Ảnh đại diện của khách hàng.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
