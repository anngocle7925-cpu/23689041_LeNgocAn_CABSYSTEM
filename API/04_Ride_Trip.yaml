openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API Document cho CAB System - nhóm nghiệp vụ đặt xe và quản lý chuyến.


    Đối chiếu SRS: FR-03.1 → FR-03.11.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Ride
  description: Đặt xe và quản lý chuyến
paths:
  /rides:
    post:
      tags:
      - Ride
      summary: Đặt xe
      operationId: createRide
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-03.1
  /rides/history:
    get:
      tags:
      - Ride
      summary: Xem lịch sử chuyến
      operationId: getRideHistory
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lịch sử chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-fr-reference: FR-03.11
  /rides/{rideId}:
    get:
      tags:
      - Ride
      summary: Xem thông tin và trạng thái chuyến
      operationId: getRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thông tin chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-fr-reference: FR-03.3, FR-03.4, FR-03.5, FR-03.6
  /rides/{rideId}/cancel:
    post:
      tags:
      - Ride
      summary: Hủy chuyến
      operationId: cancelRide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRideRequest'
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-fr-reference: FR-03.2
  /rides/{rideId}/status:
    put:
      tags:
      - Ride
      summary: Cập nhật trạng thái chuyến
      operationId: updateRideStatus
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-fr-reference: FR-03.7 → FR-03.10
components:
  schemas:
    CancelRideRequest:
      type: object
      properties:
        reason:
          type: string
          example: Không còn nhu cầu
    CreateRideRequest:
      type: object
      required:
      - pickupLocation
      - dropoffLocation
      - vehicleType
      properties:
        pickupLocation:
          $ref: '#/components/schemas/Location'
        dropoffLocation:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: MOTORBIKE
      description: Thông tin tối thiểu để tạo yêu cầu đặt xe theo SRS.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin request không hợp lệ
    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.762622
        longitude:
          type: number
          format: double
          example: 106.660172
        address:
          type: string
          example: Điểm đón
    Ride:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: CUS001
        driverId:
          type: string
          nullable: true
          example: DRV001
        pickupLocation:
          $ref: '#/components/schemas/Location'
        dropoffLocation:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: MOTORBIKE
        status:
          $ref: '#/components/schemas/RideStatus'
        fare:
          $ref: '#/components/schemas/Fare'
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverSummary'
          nullable: true
          description: Thông tin tài xế sau khi chuyến được phân công.
        etaMinutes:
          type: integer
          nullable: true
          description: Thời gian dự kiến tài xế đến, tính theo phút.
        driverLocation:
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
          description: Vị trí hiện tại của tài xế khi có dữ liệu.
    RideHistoryResponse:
      type: object
      properties:
        rides:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
    RideStatus:
      type: string
      enum:
      - SEARCHING_DRIVER
      - DRIVER_ASSIGNED
      - DRIVER_ARRIVED
      - PICKED_UP
      - IN_TRANSIT
      - COMPLETED
      - CANCELLED
    RideStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/RideStatus'
    DriverSummary:
      type: object
      properties:
        driverId:
          type: string
        fullName:
          type: string
        licensePlate:
          type: string
        avatarUrl:
          type: string
          format: uri
        phone:
          type: string
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RideId:
      name: rideId
      in: path
      required: true
      description: Mã chuyến
      schema:
        type: string
        example: RIDE001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dùng để xác thực người dùng.
